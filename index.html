<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="dist/css/lightbox.css" rel="stylesheet" />
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
    </header>
    <main>
    <div class="grid">
        <a href="images/beanhive.jpeg" data-lightbox="coffee">
            <img src="images/beanhive.jpeg" width="200" alt="A coffee in a white circular mug with latte art of a crescent moon with a face on it">
        </a>

        <a href="images/larry_lighthouse.jpeg" data-lightbox="howth">
            <img src="images/larry_lighthouse.jpeg" width= "200" alt="a wool toy sheep in front of cliffs and the ocean, and a lighthouse is on the cliff">
        </a>

        <a href="images/larry_rocks.jpeg" data-lightbox="howth">
            <img src="images/larry_rocks.jpeg"width= '200' alt="a wool toy sheep on a rock fence in front of the ocean">
        </a>

        <a href="images/sheep_malahide.jpeg" data-lightbox="malahide">
            <img src="images/sheep_malahide.jpeg" width= '200' alt="two wool toy sheep in front of a gray stone castle">
        </a>
    </div>
    </main>
    <script src="dist/js/lightbox-plus-jquery.js"></script>
</body>
</html>
